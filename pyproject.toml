[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "beatpick"
version = "0.2.1"
description = "Select Apple Music tracks by confirmed tempo coverage"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "PyYAML"]
license = "MIT"
[project.scripts]
beatpick = "beatpick.cli:main"
[tool.setuptools]
packages = ["beatpick"]

[tool.setuptools.package-data]
beatpick = ["*.js", "*.applescript"]
