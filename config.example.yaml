analysis:
  bpm_min: 165
  bpm_max: 185
  coverage_percent: 50
  window_seconds: 4
  context_seconds: 12
  max_track_seconds: 720
library:
  media_root: ~/Music
  select:
    any:
      - field: album
        contains: Neon Horizon
      - field: artist
        equals: The Lunar Echoes
state_dir: ./data
write_bpm: false
duplicates:
  enabled: true
